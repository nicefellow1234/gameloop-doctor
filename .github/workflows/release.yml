name: Build & Release GameLoop Doctor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null; $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\GameLoop-Doctor.ps1", [ref]$tokens, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax OK."

      - name: Build standalone GameLoop-Doctor.exe
        shell: powershell
        run: .\build-exe.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLoop-Doctor-Windows
          path: |
            dist/GameLoop-Doctor.exe
            GameLoop-Doctor.ps1
            Launch-GameLoop-Doctor.bat
            README.md

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GameLoop-Doctor.exe
            GameLoop-Doctor.ps1
            Launch-GameLoop-Doctor.bat
          generate_release_notes: true
